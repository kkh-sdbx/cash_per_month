<html>

<head>
<title>Hello Google!</title>
</head>

<style>

#pingsPongs{
    background-color : cyan;
}

#ping{
    background-color : green;
}

/* 테이블 스타일 */
#table-container { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
table { width: 100%; border-collapse: collapse; background: white; }
        
#tableheader { background-color: #343a40; color: white; }
#tableheader td { padding: 15px; font-weight: 600; text-align: left; }

#tableheader{
  background-color: orange;
}
</style>

<body>
  
  <div id = "pingsPongs">
        <h1> caller area</h1>
        <button id = "getAPI">!! GET API !!</button>
  </div>  
  
  <div id = "table-container">
  <table id="searchResult">
    <tr id ="tableheader">
      <td>공고월</td>
      <td>고객사</td>
      <td>사업명</td>
      <td>금액</td>
      <td>제출일시</td>
      <td>URL</td>
    </tr>
  
  </table>
  </div>

</body>

<script type ="module">
  const ping = document.getElementById("ping");
  const getAPI= document.getElementById("getAPI");
  const searchResult= document.getElementById("searchResult");

  const updateSearchResult = (data) => {
  const items = data.today; // ✅ 핵심

  for (let i = 0; i < Math.min(items.length, 20); i++) {
    const item = items[i];

    let tr = document.createElement("tr");

    let td1 = document.createElement("td");
    td1.innerHTML = item.rcptDt || "";

    let td2 = document.createElement("td");
    td2.innerHTML = item.ntceInsttNm || "";

    let td3 = document.createElement("td");
    td3.innerHTML = item.prcrmntReqNm || "";

    let td4 = document.createElement("td");
    td4.innerHTML = item.totCnstwkScleAmt || "";

    let td5 = document.createElement("td");
    td5.innerHTML = item.inptDt || "";

    let td6 = document.createElement("td");
    td6.innerHTML = item.prcrmntReqInfoUrl || "";

    tr.append(td1, td2, td3, td4, td5, td6);

    searchResult.appendChild(tr);
  }
};

  getAPI.addEventListener("click", async ()=>{
    try{
      const response = await fetch("/getAPI");

      if(!response.ok){
        throw new Error("something is wrong!" + response.status);
      }

      const data = await response.json();
      console.log(response);
      console.log(data);
      updateSearchResult(data)
    }
    catch(error){
      console.error("error: ", error );

    }

  });
</script>
</html>
